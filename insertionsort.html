<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>撲克牌大師：插入排序 (全點擊相容版)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --sorted-bg: #f1c40f;
            --card-green: #1a5e3a;
            --highlight-blue: #3498db;
        }

        body { font-family: "Microsoft JhengHei", sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .game-area { width: 100%; max-width: 850px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; }
        
        #info-msg { 
            padding: 15px; margin-bottom: 15px; background: #fffbe6; border: 1px solid #ffe58f;
            border-radius: 8px; color: #d35400; font-weight: bold; text-align: center; min-height: 24px;
        }

        .game-board-container {
            background: var(--card-green); padding: 40px 20px 20px 20px; border-radius: 12px; 
            margin-bottom: 25px; box-shadow: inset 0 0 50px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; align-items: center;
        }

        .cards-row { display: flex; justify-content: center; gap: 12px; }
        .card-slot { display: flex; flex-direction: column; align-items: center; gap: 10px; }

        .card {
            width: 65px; height: 95px; background: white; border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 22px; font-weight: bold; position: relative;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.4); cursor: pointer;
            transition: all 0.3s ease; border: 3px solid transparent;
        }

        .card.sorted { border-top: 6px solid var(--sorted-bg); }
        .card.selected { border: 3px solid var(--highlight-blue); transform: translateY(-10px); z-index: 10; }
        
        @keyframes target-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0px var(--accent-color); }
            50% { transform: scale(1.05); box-shadow: 0 0 15px var(--accent-color); }
            100% { transform: scale(1); box-shadow: 0 0 0px var(--accent-color); }
        }
        .card.next-target { animation: target-pulse 1.5s infinite; border: 3px solid var(--accent-color); }

        /* 位置編號樣式 - 增加可點擊性 */
        .pos-indicator {
            color: white; font-size: 14px; font-weight: bold;
            background: rgba(0,0,0,0.5); width: 28px; height: 28px;
            display: flex; justify-content: center; align-items: center; border-radius: 50%;
            cursor: pointer; transition: 0.2s; border: 2px solid transparent;
        }
        .pos-indicator:hover { background: var(--highlight-blue); transform: scale(1.2); }
        .pos-indicator.active-hint { background: var(--highlight-blue); border-color: white; box-shadow: 0 0 10px white; }

        .btn-group { text-align: center; margin-bottom: 20px; }
        button { padding: 10px 25px; font-size: 15px; cursor: pointer; border-radius: 6px; border: none; margin: 0 5px; font-weight: bold; }
        .btn-start { background: #3498db; color: white; }
        .btn-demo { background: #9b59b6; color: white; }

        .history-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; padding: 8px; background: #fafafa; border-radius: 5px; }
        .step-label { min-width: 90px; font-weight: bold; font-size: 14px; }
        .mini-card { width: 30px; height: 45px; background: white; border: 1px solid #ccc; display: flex; justify-content: center; align-items: center; font-size: 12px; border-radius: 4px; }
        .mini-card.highlight { background: var(--accent-color); color: white; }
    </style>
</head>
<body>

<header>
    <h1>🃏 撲克牌大師：插入排序挑戰</h1>
    <p>選取閃爍的牌，然後點擊下方編號決定插入位置！</p>
</header>

<div class="game-area">
    <div id="info-msg">點擊「開始挑戰」進入評量</div>
    
    <div class="game-board-container">
        <div class="cards-row" id="board"></div>
    </div>

    <div class="btn-group">
        <button class="btn-start" onclick="initGame()">🚀 開始挑戰模式</button>
        <button class="btn-demo" onclick="startDemo()">🎓 自動演示模式</button>
    </div>

    <div class="history-section">
        <h3>📊 排序歷程記錄</h3>
        <div id="history-log"></div>
    </div>
</div>

<script>
    let cards = [];
    let sortedIndex = 0;
    let stepCount = 0;
    let isAutoPlaying = false;
    let selectedIdx = -1; // 目前選中的未排序牌
    let currentAttempts = 0;

    function initGame() {
        isAutoPlaying = false;
        selectedIdx = -1;
        currentAttempts = 0;
        const pool = Array.from({length: 30}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
        cards = pool.slice(0, 6);
        sortedIndex = 0;
        stepCount = 0;
        document.getElementById('history-log').innerHTML = '';
        updateStatus(`✅ 初始：[ ${cards[0]} ] 已就位。請先點擊閃爍的 [ ${cards[1]} ]。`, "success");
        addHistoryRow("初始狀態", cards, -1);
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';
        cards.forEach((val, i) => {
            const slot = document.createElement('div');
            slot.className = 'card-slot';

            // 牌片
            const card = document.createElement('div');
            const isNext = (i === sortedIndex + 1 && !isAutoPlaying);
            card.className = `card ${i <= sortedIndex ? 'sorted' : ''} ${isNext ? 'next-target' : ''} ${i === selectedIdx ? 'selected' : ''}`;
            card.innerText = val;
            card.onclick = () => selectCard(i);

            // 位置編號 (點擊編號進行插入)
            const posLabel = document.createElement('div');
            posLabel.className = `pos-indicator ${selectedIdx !== -1 && i <= sortedIndex + 1 ? 'active-hint' : ''}`;
            posLabel.innerText = i + 1;
            posLabel.onclick = () => handleInsert(i);

            slot.appendChild(card);
            slot.appendChild(posLabel);
            board.appendChild(slot);
        });
    }

    // 選取要移動的牌
    function selectCard(index) {
        if (isAutoPlaying || index !== sortedIndex + 1) return;
        selectedIdx = index;
        updateStatus(`🎯 已選取 [ ${cards[index]} ]。現在請點擊下方的位置編號來插入它。`, "info");
        renderBoard();
    }

    // 處理插入動作
    function handleInsert(targetIdx) {
        if (selectedIdx === -1) return;
        
        // 限制只能插入到已排序區域內或邊界
        if (targetIdx > sortedIndex + 1) return;

        const targetValue = cards[selectedIdx];
        let correctIdx = 0;
        while (correctIdx <= sortedIndex && cards[correctIdx] < targetValue) {
            correctIdx++;
        }

        if (targetIdx === correctIdx) {
            const [moved] = cards.splice(selectedIdx, 1);
            cards.splice(targetIdx, 0, moved);
            sortedIndex++;
            stepCount++;
            selectedIdx = -1;
            currentAttempts = 0;
            addHistoryRow(`步驟 ${stepCount}`, [...cards], targetIdx);
            renderBoard();
            if (sortedIndex === cards.length - 1) {
                updateStatus(`🎉 太棒了！排序全部完成！`, "success");
            } else {
                updateStatus(`✅ 正確！下一個請選取閃爍的 [ ${cards[sortedIndex+1]} ]。`, "success");
            }
        } else {
            currentAttempts++;
            if (currentAttempts < 3) {
                updateStatus(`❌ 位置不對喔！還有 ${3 - currentAttempts} 次機會。再觀察一下數字大小！`, "warn");
            } else {
                updateStatus(`❌ 還是不對。正確位置是編號 ${correctIdx + 1}。`, "warn");
                setTimeout(() => {
                    const [moved] = cards.splice(selectedIdx, 1);
                    cards.splice(correctIdx, 0, moved);
                    sortedIndex++;
                    stepCount++;
                    selectedIdx = -1;
                    currentAttempts = 0;
                    addHistoryRow(`步驟 ${stepCount}(修正)`, [...cards], correctIdx);
                    renderBoard();
                    if(cards[sortedIndex+1]) updateStatus(`已修正。下一個請點擊閃爍的牌。`, "success");
                }, 1200);
            }
        }
    }

    function updateStatus(msg, type) {
        const el = document.getElementById('info-msg');
        el.innerText = msg;
        el.style.color = (type === "success") ? "#27ae60" : (type === "warn" ? "#e74c3c" : "#2c3e50");
    }

    function addHistoryRow(label, currentArr, highlightIdx) {
        const log = document.getElementById('history-log');
        const row = document.createElement('div');
        row.className = 'history-row';
        row.innerHTML = `<span class="step-label">${label}</span>`;
        currentArr.forEach((val, i) => {
            row.innerHTML += `<div class="mini-card ${i === highlightIdx ? 'highlight' : ''}">${val}</div>`;
        });
        log.appendChild(row);
    }

    async function startDemo() {
        initGame();
        isAutoPlaying = true;
        updateStatus("🎓 自動演示模式中...", "info");
        for (let i = 1; i < cards.length; i++) {
            let key = cards[i];
            let j = i - 1;
            selectedIdx = i;
            renderBoard();
            await new Promise(r => setTimeout(r, 1000));
            while (j >= 0 && cards[j] > key) {
                cards[j + 1] = cards[j];
                j--;
            }
            cards[j + 1] = key;
            sortedIndex = i;
            selectedIdx = -1;
            stepCount++;
            addHistoryRow(`演示步驟 ${stepCount}`, [...cards], j + 1);
            renderBoard();
            await new Promise(r => setTimeout(r, 1000));
        }
        isAutoPlaying = false;
        updateStatus("✅ 演示結束！", "success");
    }
</script>
</body>
</html>
